name: 🧹 Lint project

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Lint project
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🚀 Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: 📦 Generate localizations
        run: flutter gen-l10n

      - name: 📦 Format generated localizations
        run: dart format lib/core/l10n

      - name: 📦 Verify generated code
        run: dart run build_runner build --only-check

      - name: 🧪 Run tests
        run: flutter test --no-pub

      - name: 🔍 Analyze project source
        run: flutter analyze

      - name: ✨ Verify formatting
        run: dart format --output=none --set-exit-if-changed .

  android-build:
    name: Build and test Android with Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android debug app
        run: flutter build apk --debug --flavor dev --no-pub

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew test

  ios-build:
    name: Build unsigned iOS app
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
